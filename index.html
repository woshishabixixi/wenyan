<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="文言">
  <title>文言文生词</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="stat"><span class="stat-label">今日待复习</span><strong id="stat-due">0</strong></div>
      <div class="stat"><span class="stat-label">今日新词</span><strong id="stat-new">0</strong></div>
      <div class="stat"><span class="stat-label">连续天数</span><strong id="stat-streak">0</strong></div>
    </header>

    <main id="view" class="view"></main>

    <nav id="tabs" role="tablist">
      <button class="tab is-active" data-route="review" type="button">复习</button>
      <button class="tab" data-route="favs" type="button">收藏</button>
      <button class="tab" data-route="mastered" type="button">已掌握</button>
      <button class="tab" data-route="library" type="button">词库</button>
      <button class="tab" data-route="settings" type="button">设置</button>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="boot-error" class="boot-error" hidden></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
